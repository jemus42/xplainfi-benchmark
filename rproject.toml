[project]
name = "xplainfi-benchmark"
r_version = "4.6"

# A list of repositories to fetch packages from. Order matters: we will try to get a package from each repository in order.
# The alias is only used in this file if you want to specifically require a dependency to come from a certain repository.
# Example: { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
repositories = [
  { alias = "CRAN", url = "https://cloud.r-project.org/" },
  # vip was archived on CRAN; upstream ships releases here (https://github.com/bgreenwell/vip)
  { alias = "bgreenwell", url = "https://bgreenwell.r-universe.dev" },
]

# A list of packages to install and any additional configuration
# Examples:
# "dplyr",
# {name = "dplyr", repository = "CRAN"},
# {name = "dplyr", git = "https://github.com/tidyverse/dplyr.git", tag = "v1.1.4"},
dependencies = [
  { name = "xplainfi", git = "https://github.com/mlr-org/xplainfi", branch = "kernel-sage" },
  { name = "arf", git = "https://github.com/bips-hb/arf", branch = "main" },
  "mlbench",
  "partykit",
  "mlr3",
  "mlr3data",
  "ranger",
  "nnet",
  "batchtools",
  "here",
  "fs",
  { name = "vip", repository = "bgreenwell" },
  "yardstick",                                                                         # only a Suggests of vip >= 0.5.0, but needed for its built-in metrics
  "iml",
  "mlr3pipelines",
  "checkmate",
  "digest",
  "mvtnorm",
  "bibtex",                                                                            # transient build-time dep: libcoin, and mvtnorm's Rd \Sexpr (via Rdpack)
  "mlr3learners",
  "reticulate",
  "mlr3fselect",
  "gower",
  "parallelly",                                                                        # availableCores() for thread parity across implementations
  "rmarkdown",
  "ggplot2",
  "tidyr",
  "reactable",
  "kableExtra",
  "mlr3torch",
  "xgboost",
  "shiny",
  "forcats",
]
